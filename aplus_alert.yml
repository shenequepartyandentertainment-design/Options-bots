name: A+ Trade Alerts

on:
  schedule:
    # every 5 min, Mon-Fri, 13:00-20:55 UTC (covers market hours in EST and EDT;
    # the script itself only alerts 9:35-15:45 New York time)
    - cron: "*/5 13-20 * * 1-5"
  workflow_dispatch:

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - run: python aplus_alert_bot.py
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
